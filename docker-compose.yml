version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: agni_drishti_db
    environment:
      POSTGRES_USER: agni_user
      POSTGRES_PASSWORD: agni_password
      POSTGRES_DB: agni_drishti
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgis_data:
